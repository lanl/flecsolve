[rk23-variable]
type = rk23

[rk23-variable.options]
initial-time = 0.0
final-time = 1.0
initial-dt = 0.5
max-steps = 1000
safety-factor = 0.5
min-dt = 0.001
max-dt = 0.5
atol = 1e-5
use-fixed-dt = false

[rk23-fixed]
type = rk23

[rk23-fixed.options]
initial-time = 0.0
final-time = 1.0
initial-dt = 0.05
max-steps = 1000
safety-factor = 0.05
min-dt = 0.001
max-dt = 0.5
atol = 1e-10
use-fixed-dt = true

[rk45-variable]
type = rk45

[rk45-variable.options]
initial-time = 0.0
final-time = 1.0
initial-dt = 0.5
max-steps = 1000
safety-factor = 0.5
min-dt = 0.001
max-dt = 0.5
atol = 1e-5
use-fixed-dt = false

[rk45-fixed]
type = rk45

[rk45-fixed.options]
initial-time = 0.0
final-time = 1.0
initial-dt = 0.05
max-steps = 1000
safety-factor = 0.05
min-dt = 0.001
max-dt = 0.5
atol = 1e-10
use-fixed-dt = true

[bdf-2]
type = bdf

[bdf-2.options]
initial-time = 0.0
final-time = 1.0
initial-dt = 0.5
max-steps = 1000
min-dt = 0.001
max-dt = 0.5
timestep-selection-strategy = truncation-error
integrator = BDF2
starting-integrator = CN
calculate-time-trunc-error = false
time-trunc-error-norm = inf
predictor = leapfrog
use-predictor = true
problem-scales = 1.
trunc-error-rtol = 1e-7
trunc-error-atol = 1e-5
time-error-scaling = fixed-resolution

[bdf-5]
type = bdf

[bdf-5.options]
initial-time = 0.0
